  <div id="universal-tool-wrapper"></div>

  <!-- Dynamic Header and Footer Injections -->
  <script src="../assets/js/ssdk-header.js"></script>
  <script src="../assets/js/ssdk-footer.js"></script>

  <script type="module">
    // Load the universal tool template dynamically
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch("../templates/tool-template.html");
        const html = await res.text();
        document.getElementById("universal-tool-wrapper").innerHTML = html;
        
        // Setup Header/Footer (Assuming global functions from ssdk-header/footer)
        // Ensure Tool Engine is aware it needs to mount
        const checkCore = setInterval(async () => {
          if (window.SSDKCore) {
            clearInterval(checkCore);
            const toolEngine = window.SSDKCore.getEngine("tool");
            if (toolEngine) {
              const urlParams = new URLSearchParams(window.location.search);
              const toolId = urlParams.get("id");
              if (toolId) {
                await toolEngine.loadTool(toolId);
              } else {
                console.error("No tool ID provided in URL.");
              }
            }
          }
        }, 50);
      } catch (err) {
        console.error("Failed to load Universal Tool Template:", err);
      }
    });
  </script>
